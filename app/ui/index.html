<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw 管家</title>
    <script>
      // Resolve relative asset URLs correctly in every mount shape.
      //
      // The fnOS desktop embeds this page at `/app/openclaw-studio` — with no
      // trailing slash — so a bare `style.css` would resolve against `/app/`
      // and 404. Injecting a <base> here (before any asset tag is parsed)
      // pins the directory. Direct access at `http://nas:18790/` already ends
      // in a slash and needs nothing.
      (function () {
        var path = location.pathname;
        if (!/\/$/.test(path)) {
          var base = document.createElement("base");
          base.href = path + "/";
          document.head.appendChild(base);
        }
      })();
    </script>
    <link rel="icon" href="images/icon_64.png" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Adopt the fnOS desktop's light/dark preference before first paint so
      // there is no flash of the wrong theme.
      (function () {
        var mode = "";
        try {
          mode = window.localStorage.getItem("fnos-theme-mode") || "";
        } catch (e) {
          /* storage may be blocked in some embeds */
        }
        if (!mode) {
          mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.setAttribute("theme-mode", mode);
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main">
        <div class="skeleton" style="height: 34px; width: 240px; margin-bottom: 20px"></div>
        <div class="skeleton" style="height: 130px; margin-bottom: 16px"></div>
        <div class="skeleton" style="height: 200px"></div>
      </main>
    </div>
    <div class="toast-stack" id="toasts"></div>
    <div id="modal-root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
