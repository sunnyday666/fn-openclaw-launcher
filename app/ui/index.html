<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw 管理台</title>
    <style>
      @keyframes spin-loading {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="/app/openclaw-launcher/assets/index-1OPcg1Ix.js"></script>
    <link rel="stylesheet" crossorigin href="/app/openclaw-launcher/assets/index-DbmyE7dA.css">
  </head>

  <body>
    <script>
      document.body.setAttribute("theme-mode", window.localStorage.getItem("fnos-theme-mode") || "");
      // 在 SPA 概览页注入 Node 版本显示和更新按钮
      (function(){
        var BASE='/app/openclaw-launcher';
        function getNodeInfo(){
          return fetch(BASE+'/api/node-info').then(function(r){return r.json()}).catch(function(){return{nodeVersion:'unknown',openclawVersion:'unknown'}});
        }
        function getBase(){
          var s=document.querySelector('script[src]');
          if(s){var u=s.getAttribute('src');if(u){return u.replace(/\/assets\/.*/,'');}}
          return BASE;
        }
        function inject(){
          var base=getBase();
          var startBtn=null;
          document.querySelectorAll('button').forEach(function(b){if(b.textContent==='启动')startBtn=b;});
          if(!startBtn)return;
          var p=startBtn;
          while(p&&p.textContent.indexOf('停止')<0)p=p.parentElement;
          if(!p||p.dataset.nodeInjected)return;
          p.dataset.nodeInjected='1';
          function injectAtAnchor(html){p.insertAdjacentHTML('afterend',html);}
          getNodeInfo().then(function(info){
            var nodeV=info.nodeVersion||'unknown';
            var ocV=info.openclawVersion||'latest';
            var match=nodeV.match(/v?(\d+)\.(\d+)/);
            var minor=match?parseInt(match[2]):0;
            var patch=match?parseInt(match[3]):0;
            var needUpdate=(minor<24||(minor===24&&patch<16));
            var html='<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">';
            html+='<div style="flex:1;min-width:140px;border:1px solid var(--semi-color-border);border-radius:8px;padding:12px 16px;text-align:center;font-size:13px;">';
            html+='<div style="color:var(--semi-color-text-2);margin-bottom:4px;">Node 版本</div>';
            html+='<div style="font-size:16px;font-weight:600;color:'+(needUpdate?'#d46b08':'var(--semi-color-text-0)')+'">'+nodeV+'</div>';
            html+='</div>';
            html+='<div style="flex:1;min-width:140px;border:1px solid var(--semi-color-border);border-radius:8px;padding:12px 16px;text-align:center;font-size:13px;">';
            html+='<div style="color:var(--semi-color-text-2);margin-bottom:4px;">OpenClaw 版本</div>';
            html+='<div style="font-size:16px;font-weight:600;color:var(--semi-color-text-0)">'+ocV+'</div>';
            html+='</div>';
            html+='</div>';
            if(needUpdate){
              html+='<div style="margin-top:8px;padding:10px 14px;border-radius:8px;background:#fff7e6;border:1px solid #ffd591;font-size:12px;color:#d46b08;display:flex;align-items:center;gap:8px;">';
              html+='<span style="font-size:16px">⚠️</span><span>Node '+nodeV+' 版本较低，部分功能（如 DeepSeek Provider）需要 Node ≥24.16。';
              html+='<a href="javascript:void(0)" onclick="(async function(){if(!confirm(\'将从 nodejs.org 下载 Node 最新版本并替换当前系统 Node，期间 OpenClaw 会短暂重启，确定继续？\'))return;var el=document.getElementById(\'_node-update-tip\');el.textContent=\'⏳ 正在下载 Node...\';el.style.display=\'block\';try{var r=await fetch(\'/app/openclaw-launcher/api/node-update\',{method:\'POST\'});var d=await r.json();if(d.ok){el.textContent=\'✅ Node 已更新为 \'+d.newVersion+\',正在重启 OpenClaw...\';setTimeout(function(){location.reload()},3000)}else{el.textContent=\'❌ 更新失败: \'+(d.error||\'未知错误\');el.style.color=\'#cf1322\';el.style.background=\'#fff1f0\';el.style.border=\'1px solid #ffa39e\'}}catch(e){el.textContent=\'❌ 网络错误，请稍后重试\';el.style.color=\'#cf1322\';el.style.background=\'#fff1f0\';el.style.border=\'1px solid #ffa39e\'}})()" style="color:#1677ff;text-decoration:underline;cursor:pointer;white-space:nowrap;">更新 Node</a></span>';
              html+='<div id="_node-update-tip" style="display:none;margin-top:6px;padding:6px 10px;border-radius:4px;font-size:12px;"></div>';
              html+='</div>';
            }
            injectAtAnchor(html);
          });
        }
        var obs=new MutationObserver(function(){inject()});
        obs.observe(document.body,{childList:true,subtree:true});
        setTimeout(inject,2000);
      })();
    </script>
    <div id="app"></div>
    <div
      id="loading"
      style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;"
    >
      <div style="animation: spin-loading 1s linear infinite; width: 24px; height: 24px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M18.364 5.63609L16.95 7.05009C15.8049 5.90489 14.2982 5.19215 12.6865 5.03333C11.0748 4.87451 9.45794 5.27942 8.11134 6.17908C6.76474 7.07874 5.77174 8.41748 5.30154 9.9672C4.83134 11.5169 4.91302 13.1817 5.53268 14.678C6.15234 16.1742 7.27162 17.4093 8.69983 18.1728C10.128 18.9363 11.7768 19.181 13.3652 18.8652C14.9536 18.5493 16.3833 17.6925 17.4108 16.4407C18.4382 15.1889 18.9999 13.6196 19 12.0001H21C21 14.0823 20.278 16.1001 18.957 17.7096C17.6361 19.3192 15.7979 20.4209 13.7557 20.8271C11.7136 21.2333 9.5937 20.9188 7.75737 19.9373C5.92104 18.9557 4.48187 17.3678 3.68506 15.4441C2.88825 13.5204 2.78311 11.3799 3.38756 9.38739C3.992 7.39486 5.26863 5.67355 6.99992 4.51675C8.73121 3.35996 10.81 2.83925 12.8822 3.04336C14.9544 3.24746 16.8917 4.16375 18.364 5.63609Z"
            fill="rgba(33,115,223,1)"
          />
        </svg>
      </div>
    </div>
  </body>
</html>
