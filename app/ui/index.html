<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw 管家</title>
    <script>
      // Resolve relative asset URLs correctly in every mount shape.
      //
      // The fnOS desktop embeds this page at `/app/openclaw-studio` — with no
      // trailing slash — so a bare `style.css` would resolve against `/app/`
      // and 404. Injecting a <base> here (before any asset tag is parsed)
      // pins the directory. Direct access at `http://nas:18790/` already ends
      // in a slash and needs nothing.
      (function () {
        var path = location.pathname;
        if (!/\/$/.test(path)) {
          var base = document.createElement("base");
          base.href = path + "/";
          document.head.appendChild(base);
        }
      })();
    </script>
    <link rel="icon" href="images/icon_64.png" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Adopt the fnOS desktop's light/dark preference before first paint, then
      // keep following it for as long as the app stays open.
      //
      // fnOS stores an *enum*, not a word: 10 = light, 20 = dark, 30 = follow
      // the system. Copying that value straight into the attribute ("30") matches
      // no CSS rule, which silently pinned the whole app to light — even when the
      // desktop itself was dark.
      (function () {
        var DARK = "dark";
        var LIGHT = "light";

        function osPrefersDark() {
          return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }

        function readPreference() {
          try {
            // The desktop writes `os-theme-mode`; embeds read `fnos-theme-mode`.
            // Both carry the same enum, so accept either.
            var fnos = window.localStorage.getItem("fnos-theme-mode");
            if (fnos) return String(fnos).trim().toLowerCase();
            var os = window.localStorage.getItem("os-theme-mode");
            if (os) return String(os).trim().toLowerCase();
          } catch (e) {
            /* storage may be blocked in some embeds */
          }
          return "";
        }

        function resolve() {
          switch (readPreference()) {
            case "20":
            case "dark":
              return DARK;
            case "10":
            case "light":
              return LIGHT;
            // "30" — and anything unrecognised — means "follow the system".
            default:
              return osPrefersDark() ? DARK : LIGHT;
          }
        }

        function apply() {
          document.documentElement.setAttribute("theme-mode", resolve());
        }

        window.__applyTheme = apply;
        apply();

        // The desktop writes to localStorage from the parent frame; a same-origin
        // embed receives a `storage` event for it, so switches apply live instead
        // of only on reload.
        window.addEventListener("storage", function (e) {
          if (!e.key || /theme-mode/.test(e.key)) apply();
        });

        // In "follow the system" mode the answer changes with the OS setting.
        if (window.matchMedia) {
          var mq = window.matchMedia("(prefers-color-scheme: dark)");
          if (mq.addEventListener) mq.addEventListener("change", apply);
          else if (mq.addListener) mq.addListener(apply);
        }
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main">
        <div class="skeleton" style="height: 34px; width: 240px; margin-bottom: 20px"></div>
        <div class="skeleton" style="height: 130px; margin-bottom: 16px"></div>
        <div class="skeleton" style="height: 200px"></div>
      </main>
    </div>
    <div class="toast-stack" id="toasts"></div>
    <div id="modal-root"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
