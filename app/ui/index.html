<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw 管理台</title>
    <style>
      @keyframes spin-loading {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/app/openclaw-launcher/assets/index-1OPcg1Ix.js"></script>
    <link rel="stylesheet" crossorigin href="/app/openclaw-launcher/assets/index-DbmyE7dA.css">
  </head>

  <body>
    <script>
      document.body.setAttribute("theme-mode", window.localStorage.getItem("fnos-theme-mode") || "");
    </script>
    <div id="app"></div>
    <div
      id="loading"
      style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;"
    >
      <div style="animation: spin-loading 1s linear infinite; width: 24px; height: 24px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M18.364 5.63609L16.95 7.05009C15.8049 5.90489 14.2982 5.19215 12.6865 5.03333C11.0748 4.87451 9.45794 5.27942 8.11134 6.17908C6.76474 7.07874 5.77174 8.41748 5.30154 9.9672C4.83134 11.5169 4.91302 13.1817 5.53268 14.678C6.15234 16.1742 7.27162 17.4093 8.69983 18.1728C10.128 18.9363 11.7768 19.181 13.3652 18.8652C14.9536 18.5493 16.3833 17.6925 17.4108 16.4407C18.4382 15.1889 18.9999 13.6196 19 12.0001H21C21 14.0823 20.278 16.1001 18.957 17.7096C17.6361 19.3192 15.7979 20.4209 13.7557 20.8271C11.7136 21.2333 9.5937 20.9188 7.75737 19.9373C5.92104 18.9557 4.48187 17.3678 3.68506 15.4441C2.88825 13.5204 2.78311 11.3799 3.38756 9.38739C3.992 7.39486 5.26863 5.67355 6.99992 4.51675C8.73121 3.35996 10.81 2.83925 12.8822 3.04336C14.9544 3.24746 16.8917 4.16375 18.364 5.63609Z"
            fill="rgba(33,115,223,1)"
          />
        </svg>
      </div>
    </div>
    <script>
      (function () {
        var BASE = '/app/openclaw-launcher';
        var s = document.querySelector('script[src*="/assets/"]');
        if (s) BASE = s.getAttribute('src').replace(/\/assets\/.*$/, '') || BASE;

        function api(path, opt) {
          return fetch(BASE + path, opt).then(function (r) { return r.json(); });
        }

        function findButtonRow() {
          var startBtn = null;
          var btns = document.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            if (btns[i].textContent.trim() === '启动') { startBtn = btns[i]; break; }
          }
          if (!startBtn) return null;
          var row = startBtn.parentElement;
          while (row && row !== document.body) {
            var t = row.textContent || '';
            if (t.indexOf('重启') >= 0 && t.indexOf('检查更新') >= 0) return row;
            row = row.parentElement;
          }
          return null;
        }

        function inject() {
          if (document.getElementById('_nodeWrap')) return true;
          var row = findButtonRow();
          if (!row || !row.parentElement) return false;

          var wrap = document.createElement('div');
          wrap.id = '_nodeWrap';
          wrap.style.cssText = 'margin-top:16px;padding-top:16px;border-top:1px solid var(--semi-color-border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-family:system-ui,-apple-system,sans-serif;';
          wrap.innerHTML =
            '<span style="color:var(--semi-color-text-2)">Node 版本</span>' +
            '<select id="_nodeSel" style="padding:4px 10px;border-radius:6px;border:1px solid var(--semi-color-border);background:var(--semi-color-bg-1);color:var(--semi-color-text-0);font-size:13px;font-weight:600;cursor:pointer;"></select>' +
            '<button id="_nodeLoad" style="padding:4px 12px;border-radius:6px;border:1px solid var(--semi-color-border);background:transparent;color:var(--semi-color-text-0);font-size:13px;cursor:pointer;">加载版本列表</button>' +
            '<button id="_nodeInstall" style="padding:4px 12px;border-radius:6px;border:1px solid var(--semi-color-primary);background:var(--semi-color-primary);color:#fff;font-size:13px;cursor:pointer;">安装所选版本</button>' +
            '<span style="color:var(--semi-color-text-2)">OpenClaw</span>' +
            '<strong id="_ocVer" style="color:var(--semi-color-text-0)">—</strong>' +
            '<span id="_nodeTip" style="color:var(--semi-color-text-2)"></span>';

          row.parentElement.insertBefore(wrap, row.nextSibling);

          var sel = document.getElementById('_nodeSel');
          var tip = document.getElementById('_nodeTip');

          api('/api/node-info').then(function (info) {
            var nodeV = info.nodeVersion || 'v?';
            var ocV = info.openclawVersion || 'latest';
            var src = info.nodeSource === 'local' ? '应用自带' : '系统';
            var mm = nodeV.match(/v?(\d+)\.(\d+)/);
            var needUpdate = !(mm && parseInt(mm[1], 10) >= 24 && parseInt(mm[2], 10) >= 16);
            sel.innerHTML = '<option value="' + nodeV + '">' + nodeV + ' · ' + src + '</option>';
            document.getElementById('_ocVer').textContent = ocV;
            if (needUpdate) {
              sel.style.color = '#d46b08';
              tip.style.color = '#d46b08';
              tip.textContent = '⚠️ 当前 ' + nodeV + '（' + src + '），装到 ≥24.16 才支持 DeepSeek Provider';
            } else {
              tip.style.color = '#389e0d';
              tip.textContent = '✅ 版本满足要求';
            }
          }).catch(function () {});

          document.getElementById('_nodeLoad').onclick = function () {
            tip.style.color = 'var(--semi-color-text-2)';
            tip.textContent = '⏳ 正在加载版本列表...';
            api('/api/node-versions').then(function (d) {
              var vs = (d && d.versions) || [];
              if (!vs.length) { tip.textContent = '❌ 没有取到可用版本'; return; }
              sel.innerHTML = vs.map(function (v) {
                return '<option value="' + v.version + '">' + v.version + (v.lts ? ' (LTS)' : '') + '</option>';
              }).join('');
              sel.value = vs[0].version;
              tip.textContent = '已加载 ' + vs.length + ' 个版本，选择后点「安装所选版本」';
            }).catch(function () { tip.textContent = '❌ 加载失败，请检查网络'; });
          };

          document.getElementById('_nodeInstall').onclick = function () {
            var v = sel.value || '';
            if (v.charAt(0) !== 'v') { tip.textContent = '请先点「加载版本列表」再选择版本'; return; }
            if (!confirm('将安装 Node ' + v + ' 并替换当前版本，OpenClaw 会短暂重启，确定继续？')) return;
            tip.style.color = 'var(--semi-color-text-2)';
            tip.textContent = '⏳ 正在下载安装 ' + v + '，请稍候（约 30MB）...';
            api('/api/node-update', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ version: v })
            }).then(function (d) {
              if (d && d.ok) {
                tip.style.color = '#389e0d';
                tip.textContent = '✅ 已安装 ' + d.newVersion + '，3 秒后刷新页面...';
                setTimeout(function () { location.reload(); }, 3000);
              } else {
                tip.style.color = '#cf1322';
                tip.textContent = '❌ ' + ((d && d.error) || '安装失败');
              }
            }).catch(function () {
              tip.style.color = '#cf1322';
              tip.textContent = '❌ 网络错误，请稍后重试';
            });
          };

          return true;
        }

        // #app 之后的脚本：#app 已存在，observer 目标必定有效
        var root = document.getElementById('app') || document.body;
        try {
          new MutationObserver(function () { inject(); }).observe(root, { childList: true, subtree: true });
        } catch (e) { /* 忽略：下面的轮询仍会兜底 */ }

        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (inject() || tries > 120) clearInterval(timer);
        }, 500);
      })();
    </script>
  </body>
</html>
