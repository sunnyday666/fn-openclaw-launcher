<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClaw 管理台</title>
    <style>
      @keyframes spin-loading {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/app/openclaw-launcher/assets/index-1OPcg1Ix.js"></script>
    <link rel="stylesheet" crossorigin href="/app/openclaw-launcher/assets/index-DbmyE7dA.css">
  </head>

  <body>
    <script>
      document.body.setAttribute("theme-mode", window.localStorage.getItem("fnos-theme-mode") || "");
      (function(){
        var BASE='/app/openclaw-launcher';
        function api(p,opt){return fetch(BASE+p,opt).then(function(r){return r.json()});}
        function inject(){
          var startBtn=null;
          document.querySelectorAll('button').forEach(function(b){if(b.textContent.trim()==='启动')startBtn=b;});
          if(!startBtn)return;
          // 找到包含启动/停止/重启/检查更新 的按钮行
          var row=startBtn.parentElement;
          while(row&&!(row.textContent.indexOf('重启')>=0&&row.textContent.indexOf('检查更新')>=0))row=row.parentElement;
          if(!row||row.dataset.nodeRow)return;
          row.dataset.nodeRow='1';
          api('/api/node-info').then(function(info){
            var nodeV=info.nodeVersion||'v?';
            var ocV=info.openclawVersion||'latest';
            var m=nodeV.match(/v?(\d+)\.(\d+)/);
            var needUpdate=!(m&&parseInt(m[1])>=24&&parseInt(m[2])>=16);
            var wrap=document.createElement('div');
            wrap.style.cssText='margin-top:16px;padding-top:16px;border-top:1px solid var(--semi-color-border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;';
            wrap.innerHTML=
              '<span style="color:var(--semi-color-text-2)">Node 版本</span>'+
              '<select id="_nodeSel" style="padding:4px 8px;border-radius:6px;border:1px solid var(--semi-color-border);background:var(--semi-color-bg-1);color:'+(needUpdate?'#d46b08':'var(--semi-color-text-0)')+';font-size:13px;font-weight:600;cursor:pointer;">'+
                '<option>'+nodeV+'</option>'+
              '</select>'+
              '<button id="_nodeBtn" style="padding:4px 12px;border-radius:6px;border:1px solid var(--semi-color-primary);background:var(--semi-color-primary);color:#fff;font-size:13px;cursor:pointer;">安装所选版本</button>'+
              '<button id="_nodeRefresh" style="padding:4px 12px;border-radius:6px;border:1px solid var(--semi-color-border);background:transparent;color:var(--semi-color-text-0);font-size:13px;cursor:pointer;">加载版本列表</button>'+
              '<span style="color:var(--semi-color-text-2)">OpenClaw</span>'+
              '<strong style="color:var(--semi-color-text-0)">'+ocV+'</strong>'+
              (needUpdate?'<span style="color:#d46b08">⚠️ Node ≥24.16 才支持 DeepSeek Provider</span>':'')+
              '<span id="_nodeTip" style="display:none;"></span>';
            row.insertAdjacentHTML('afterend','');
            row.parentElement.insertBefore(wrap,row.nextSibling);
            var sel=document.getElementById('_nodeSel');
            var tip=document.getElementById('_nodeTip');
            document.getElementById('_nodeRefresh').onclick=function(){
              tip.style.display='inline';tip.style.color='var(--semi-color-text-2)';tip.textContent='⏳ 加载中...';
              api('/api/node-versions').then(function(d){
                var vs=d.versions||[];
                if(!vs.length){tip.textContent='❌ 无可用版本';return;}
                sel.innerHTML=vs.map(function(v){return '<option value="'+v.version+'">'+v.version+(v.lts?' (LTS)':'')+'</option>';}).join('');
                sel.value=vs[0].version;
                tip.textContent='已加载 '+vs.length+' 个版本';
              }).catch(function(){tip.textContent='❌ 加载失败';});
            };
            document.getElementById('_nodeBtn').onclick=function(){
              var v=sel.value;
              if(!v||v.indexOf('v')!==0){tip.style.display='inline';tip.textContent='请先点「加载版本列表」并选择版本';return;}
              if(!confirm('将安装 Node '+v+' 替换当前版本，OpenClaw 会短暂重启，确定继续？'))return;
              tip.style.display='inline';tip.style.color='var(--semi-color-text-2)';tip.textContent='⏳ 正在下载安装 '+v+'...';
              api('/api/node-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:v})}).then(function(d){
                if(d.ok){tip.style.color='#389e0d';tip.textContent='✅ 已安装 '+d.newVersion+'，3 秒后刷新...';setTimeout(function(){location.reload()},3000);}
                else{tip.style.color='#cf1322';tip.textContent='❌ '+(d.error||'安装失败');}
              }).catch(function(){tip.style.color='#cf1322';tip.textContent='❌ 网络错误';});
            };
          });
        }
        var obs=new MutationObserver(function(){inject()});
        obs.observe(document.getElementById('app'),{childList:true,subtree:true});
        setTimeout(inject,2000);
      })();
    </script>
    <div id="app"></div>
    <div
      id="loading"
      style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;"
    >
      <div style="animation: spin-loading 1s linear infinite; width: 24px; height: 24px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M18.364 5.63609L16.95 7.05009C15.8049 5.90489 14.2982 5.19215 12.6865 5.03333C11.0748 4.87451 9.45794 5.27942 8.11134 6.17908C6.76474 7.07874 5.77174 8.41748 5.30154 9.9672C4.83134 11.5169 4.91302 13.1817 5.53268 14.678C6.15234 16.1742 7.27162 17.4093 8.69983 18.1728C10.128 18.9363 11.7768 19.181 13.3652 18.8652C14.9536 18.5493 16.3833 17.6925 17.4108 16.4407C18.4382 15.1889 18.9999 13.6196 19 12.0001H21C21 14.0823 20.278 16.1001 18.957 17.7096C17.6361 19.3192 15.7979 20.4209 13.7557 20.8271C11.7136 21.2333 9.5937 20.9188 7.75737 19.9373C5.92104 18.9557 4.48187 17.3678 3.68506 15.4441C2.88825 13.5204 2.78311 11.3799 3.38756 9.38739C3.992 7.39486 5.26863 5.67355 6.99992 4.51675C8.73121 3.35996 10.81 2.83925 12.8822 3.04336C14.9544 3.24746 16.8917 4.16375 18.364 5.63609Z"
            fill="rgba(33,115,223,1)"
          />
        </svg>
      </div>
    </div>
  </body>
</html>
